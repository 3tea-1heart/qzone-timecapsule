name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/QZoneArchive/QZoneArchive.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match project version' }
      - name: Synthetic regression tests
        shell: pwsh
        run: dotnet run --project tests/TimeCapsule.Tests -c Release -- artifacts/tests/ci
      - name: Build Windows package
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $files = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --title "时光留存 $version" --notes-file "docs/更新说明-$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
